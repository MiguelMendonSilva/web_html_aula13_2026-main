<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Convidados</title>
    <style>
        
        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 50%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
    <script>
        window.onload = inicio;
        
        
        let listaConvidados = new Set();

        function inicio() {
            let botao = document.getElementById('botao');
            botao.addEventListener('click', cadastrar);
        }

        function cadastrar() {
            
            let campoNome = document.getElementById('nome');
            let campoSexo = document.getElementById('sexo');
            let campoEmail = document.getElementById('email');

            
            let convidado = {
                nome: campoNome.value,
                sexo: campoSexo.value,
                email: campoEmail.value
            };

            
            listaConvidados.add(convidado);

            
            campoNome.value = "";
            campoSexo.value = "";
            campoEmail.value = "";

            
            atualizarTabela();
        }

        function atualizarTabela() {
            let corpoTabela = document.getElementById('corpoTabela');
            
            
            corpoTabela.innerHTML = "";

            
            for (let pessoa of listaConvidados) {
                corpoTabela.innerHTML += `
                    <tr>
                        <td>${pessoa.nome}</td>
                        <td>${pessoa.sexo}</td>
                        <td>${pessoa.email}</td>
                    </tr>
                `;
            }
        }
    </script>
</head>

<body>
    <h2>Cadastro de Convidados da Festa</h2>
    
    <label for="nome">Nome:</label>
    <input type="text" id="nome">
    <br><br>
    
    <label for="sexo">Sexo:</label>
    <select id="sexo">
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
    </select>
    <br><br>
    
    <label for="email">E-mail:</label>
    <input type="email" id="email">
    <br><br>
    
    <button id="botao">Cadastrar Convidado</button>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Sexo</th>
                <th>E-mail</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            </tbody>
    </table>

</body>

</html>
